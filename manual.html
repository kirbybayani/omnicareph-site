<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Operations Manual | OmniCare Medical Supplies</title>
<style>
  :root{--blue:#1247a5;--blue-deep:#0b2f70;--sky:#38b6f0;--sky-soft:#e6f4fd;--gold:#f2a41f;
    --navy:#0a2456;--ink:#0f1c2e;--gray:#5c6b7f;--gray-light:#8a97a8;--bg-tint:#f6fafd;--line:#e3ecf4}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg-tint);line-height:1.6;-webkit-font-smoothing:antialiased}
  /* ---- login ---- */
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(165deg,var(--navy) 0%,#0d3480 60%,#11418f 100%);padding:24px}
  .gate-card{background:#fff;border-radius:22px;padding:42px 38px;max-width:400px;width:100%;
    box-shadow:0 24px 70px rgba(0,0,0,.35)}
  .gate-card .brand{font-size:21px;font-weight:800;letter-spacing:-.01em}
  .gate-card .brand span{color:var(--sky)}
  .gate-card h1{font-size:16px;font-weight:600;color:var(--gray);margin:6px 0 26px}
  .gate-card label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  .gate-card input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    font:inherit;font-size:15px;background:var(--bg-tint);outline:none;margin-bottom:16px;
    transition:border-color .2s, box-shadow .2s}
  .gate-card input:focus{border-color:var(--sky);background:#fff;box-shadow:0 0 0 3px var(--sky-soft)}
  .gate-card button{width:100%;border:0;border-radius:999px;padding:13px;cursor:pointer;
    font:inherit;font-size:15px;font-weight:700;color:#241703;
    background:linear-gradient(135deg,var(--gold),#d98a0b)}
  .gate-card button:disabled{opacity:.6;cursor:wait}
  #gate-err{display:none;background:#fdeaea;border:1px solid #f3c2c2;color:#9b1c1c;
    border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
  .gate-note{font-size:12px;color:var(--gray-light);margin-top:18px;text-align:center}
  /* ---- app ---- */
  #app{display:none}
  .topbar{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;
    display:flex;align-items:center;gap:14px;padding:12px 18px}
  .topbar .brand{font-weight:800;font-size:16px;white-space:nowrap;color:#fff;text-decoration:none}
  .topbar .brand span{color:var(--sky)}
  .topbar .ttl{font-size:13px;color:rgba(255,255,255,.65);white-space:nowrap}
  #q{flex:1;max-width:340px;margin-left:auto;border:0;border-radius:999px;padding:9px 16px;
    font:inherit;font-size:13.5px;background:rgba(255,255,255,.14);color:#fff;outline:none}
  #q::placeholder{color:rgba(255,255,255,.55)}
  .tbtn{border:0;border-radius:999px;padding:8px 15px;cursor:pointer;font:inherit;font-size:13px;
    font-weight:700;background:rgba(255,255,255,.14);color:#fff}
  .tbtn:hover{background:rgba(255,255,255,.25)}
  #menu-btn{display:none}
  .layout{display:flex;min-height:calc(100vh - 54px)}
  nav{width:300px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
    padding:18px 0 40px;overflow-y:auto;height:calc(100vh - 54px);position:sticky;top:54px}
  .sec{padding:4px 0}
  .sec-h{display:flex;gap:9px;align-items:baseline;padding:8px 18px;cursor:pointer;
    font-size:13.5px;font-weight:800;letter-spacing:-.01em}
  .sec-h:hover{background:var(--bg-tint)}
  .sec-h .n{color:var(--sky);font-size:12px;min-width:16px}
  .sec .docs{display:none}
  .sec.open .docs{display:block}
  .doc-link{display:block;padding:6px 18px 6px 43px;font-size:13px;color:var(--gray);
    text-decoration:none;border-left:3px solid transparent}
  .doc-link:hover{background:var(--bg-tint)}
  .doc-link.on{color:var(--blue);font-weight:700;border-left-color:var(--gold);background:var(--sky-soft)}
  main{flex:1;min-width:0;padding:34px 44px 80px;max-width:980px}
  .crumb{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);font-weight:700}
  .badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;border-radius:999px;
    padding:3px 10px;margin-left:8px;vertical-align:2px}
  .badge.sop{background:var(--sky-soft);color:var(--blue)}
  .badge.form{background:#fdf3dd;color:#b07708}
  main h1{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:6px 0 24px}
  .doc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px 38px}
  .doc h3{font-size:19px;font-weight:800;color:var(--blue-deep);margin:26px 0 10px;
    padding-top:18px;border-top:1px solid var(--line)}
  .doc h3:first-child{margin-top:0;padding-top:0;border-top:0}
  .doc h4{font-size:15.5px;font-weight:700;color:var(--blue);margin:18px 0 8px}
  .doc p{font-size:14.5px;color:var(--gray);margin-bottom:10px}
  .doc ul{margin:0 0 12px 22px;display:grid;gap:5px}
  .doc li{font-size:14.5px;color:var(--gray)}
  .doc table{width:100%;border-collapse:collapse;margin:12px 0 16px;font-size:13.5px}
  .doc td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;color:var(--gray)}
  .doc tr:first-child td{background:var(--bg-tint);font-weight:700;color:var(--ink)}
  .doc .ctr{text-align:center}
  .pager{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
  .pager a{flex:1;max-width:48%;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:14px 18px;text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:700}
  .pager a small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--gray-light);font-weight:700;margin-bottom:3px}
  .pager a:hover{border-color:var(--sky)}
  .pager .next{margin-left:auto;text-align:right}
  #results{display:none;padding:10px 12px}
  #results a{display:block;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:13px}
  #results a:hover{background:var(--bg-tint)}
  #results a b{color:var(--blue)}
  #results .where{font-size:11.5px;color:var(--gray-light)}
  @media(max-width:860px){
    nav{position:fixed;left:0;top:54px;bottom:0;height:auto;z-index:20;transform:translateX(-102%);
      transition:transform .25s;box-shadow:12px 0 40px rgba(0,0,0,.15)}
    nav.show{transform:none}
    #menu-btn{display:inline-block}
    main{padding:24px 18px 70px}
    .doc{padding:22px 18px}
    .topbar .ttl{display:none}
    #q{max-width:150px}
  }
  @media print{
    .topbar,nav,.pager{display:none!important}
    body{background:#fff}
    main{padding:0;max-width:none}
    .doc{border:0;padding:0}
  }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="brand">Omni<span>Care</span> Medical Supplies</div>
    <h1>Medical Device Distribution Manual</h1>
    <div id="gate-err">Incorrect username or password.</div>
    <form id="gate-form">
      <label>Username</label>
      <input id="u" type="text" autocomplete="username" autocapitalize="none" required>
      <label>Password</label>
      <input id="p" type="password" autocomplete="current-password" required>
      <button type="submit" id="go">Open Manual</button>
    </form>
    <p class="gate-note">Authorized personnel only. The manual is encrypted; access requires the issued credentials.</p>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <button class="tbtn" id="menu-btn">Menu</button>
    <a class="brand" href="https://omnicareph.com">Omni<span>Care</span></a>
    <span class="ttl">Medical Device Distribution Manual</span>
    <input id="q" type="search" placeholder="Search the manual...">
    <button class="tbtn" onclick="window.print()">Print</button>
    <button class="tbtn" id="lock">Log out</button>
  </div>
  <div class="layout">
    <nav id="nav"><div id="results"></div><div id="toc"></div></nav>
    <main id="main"></main>
  </div>
</div>

var DATA = null, FLAT = [];

function b2a(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }

async function deriveKey(user, pass){
  var mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(user.trim().toLowerCase() + ':' + pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt: b2a(ENC.salt), iterations: ENC.iter, hash:'SHA-256'}, mat, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function tryUnlock(key){
  var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: b2a(ENC.iv)}, key, b2a(ENC.ct));
  DATA = JSON.parse(new TextDecoder().decode(pt));
}

document.getElementById('gate-form').addEventListener('submit', function(e){
  e.preventDefault();
  var btn = document.getElementById('go'); btn.disabled = true; btn.textContent = 'Checking...';
  deriveKey(document.getElementById('u').value, document.getElementById('p').value)
    .then(function(key){
      return tryUnlock(key).then(function(){
        return crypto.subtle.exportKey('raw', key).then(function(raw){
          try { sessionStorage.setItem('omx_k', btoa(String.fromCharCode.apply(null, new Uint8Array(raw)))); } catch(_){}
        });
      });
    })
    .then(boot)
    .catch(function(){
      btn.disabled = false; btn.textContent = 'Open Manual';
      document.getElementById('gate-err').style.display = 'block';
      document.getElementById('p').value = '';
    });
});

// auto-unlock within the same browser session
(function(){
  var k = null; try { k = sessionStorage.getItem('omx_k'); } catch(_){}
  if (!k) return;
  crypto.subtle.importKey('raw', b2a(k), {name:'AES-GCM'}, false, ['decrypt'])
    .then(function(key){ return tryUnlock(key); }).then(boot).catch(function(){});
})();

document.getElementById('lock').addEventListener('click', function(){
  try { sessionStorage.removeItem('omx_k'); } catch(_){}
  location.hash = ''; location.reload();
});

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function boot(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  FLAT = [];
  DATA.forEach(function(sec){ sec.docs.forEach(function(d){ d.sec = sec; FLAT.push(d); }); });
  var toc = document.getElementById('toc'), h = '';
  DATA.forEach(function(sec){
    h += '<div class="sec" id="sec-' + sec.id + '"><div class="sec-h" data-sec="' + sec.id + '">' +
         '<span class="n">' + (sec.num || '&#9733;') + '</span><span>' + esc(sec.title) + '</span></div><div class="docs">';
    sec.docs.forEach(function(d){ h += '<a class="doc-link" id="lnk-' + d.id + '" href="#' + d.id + '">' + esc(d.title) + '</a>'; });
    h += '</div></div>';
  });
  toc.innerHTML = h;
  toc.addEventListener('click', function(e){
    var sh = e.target.closest('.sec-h');
    if (sh) sh.parentNode.classList.toggle('open');
  });
  document.getElementById('menu-btn').addEventListener('click', function(){
    document.getElementById('nav').classList.toggle('show');
  });
  window.addEventListener('hashchange', route);
  route();
}

function route(){
  if (!DATA) return;
  var id = (location.hash || '').slice(1);
  var doc = FLAT.filter(function(d){ return d.id === id; })[0] || FLAT[0];
  render(doc);
}

function render(doc){
  var i = FLAT.indexOf(doc), prev = FLAT[i-1], next = FLAT[i+1];
  var h = '<div class="crumb">' + (doc.sec.num ? 'Section ' + doc.sec.num + ' &middot; ' : '') + esc(doc.sec.title) +
          '<span class="badge ' + doc.type + '">' + (doc.type === 'sop' ? 'SOP' : 'FORM') + '</span></div>' +
          '<h1>' + esc(doc.title.replace(/^(SOP|Form): /, '')) + '</h1>' +
          '<div class="doc">' + doc.html + '</div><div class="pager">';
  if (prev) h += '<a href="#' + prev.id + '"><small>Previous</small>' + esc(prev.title) + '</a>';
  if (next) h += '<a class="next" href="#' + next.id + '"><small>Next</small>' + esc(next.title) + '</a>';
  h += '</div>';
  var main = document.getElementById('main');
  main.innerHTML = h; window.scrollTo(0, 0);
  document.querySelectorAll('.doc-link.on').forEach(function(a){ a.classList.remove('on'); });
  var lnk = document.getElementById('lnk-' + doc.id);
  if (lnk){ lnk.classList.add('on'); lnk.closest('.sec').classList.add('open'); }
  document.getElementById('nav').classList.remove('show');
}

document.getElementById('q').addEventListener('input', function(){
  var q = this.value.trim().toLowerCase();
  var res = document.getElementById('results'), toc = document.getElementById('toc');
  if (!q){ res.style.display = 'none'; toc.style.display = 'block'; return; }
  var hits = FLAT.map(function(d){
    var text = d.title + ' ' + d.html.replace(/<[^>]+>/g, ' ');
    var pos = text.toLowerCase().indexOf(q);
    return pos < 0 ? null : {d: d, snip: text.substr(Math.max(0, pos - 30), 90)};
  }).filter(Boolean).slice(0, 25);
  res.innerHTML = hits.length
    ? hits.map(function(h){ return '<a href="#' + h.d.id + '"><b>' + esc(h.d.title) + '</b><div class="where">' + esc(h.snip) + '...</div></a>'; }).join('')
    : '<a><b>No matches</b></a>';
  res.style.display = 'block'; toc.style.display = 'none';
});
</script>
</body>
